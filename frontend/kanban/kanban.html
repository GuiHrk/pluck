<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluck manager</title>

<link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="kanban.css">


</head>
<body>

<div class="app-layout">

  <aside class="sidebar"> 

    <h3 class="logo"> Pluck </h3>
    <button class="sidebar-btn active">Kanban</button>

    <button class="sidebar-btn" data-bs-toggle="offcanvas" data-bs-target="#userPanel"> Perfil</button>

    <button class="sidebar-btn" data-bs-toggle="offcanvas" data-bs-target="#groupPanel"> Grupo</button>

  </aside>


  <main class="main-content">

      <div class="topbar">

          <h2 class="fw-bold"> Kanban </h2>

          <div class="actions"> 
            <button type="button" class="btn btn-primary" id="btnCriarGrupo">Criar Grupo</button>
          
           <button type="button" class="btn btn-primary" id="btnEntrarGrupo"> Entrar em Grupo</button>
      
          </div>
      </div>


      <div class="kanban-wrapper"> 
      <div class="board">

        <div class="column" id="todo">
            <h5>To do</h5>
            <div class="tasks-container"></div>
            <button class="add-btn">+ Adicionar</button>
            </div>
            
            <div class="column" id="doing">
            <h5>Doing</h5>
            <div class="tasks-container"></div>
            <button class="add-btn">+ Adicionar</button>
            </div>
            
            <div class="column" id="done">
            <h5>Done</h5>
            <div class="tasks-container"></div>
            <button class="add-btn">+ Adicionar</button>
            </div>
    
    </div>
      </div>

    <footer class="footer">
        <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <span>
                    © 2026 Pluck
                </span>
                    <a href="politicas.html">
                    Políticas de Privacidade
                </a>
                </div>
            </div>
        </footer>
  </main>

<!-- OFFCANVAS USUÁRIO -->

<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="userPanel">

    <div class="offcanvas-header">

        <h5>Meu Perfil</h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body">

        <div class="mb-3">

            <label class="form-label">
                Nome
            </label>

            <input type="text"
                   class="form-control"
                   id="userName"
                   disabled>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   id="userEmail"
                   disabled>

        </div>

        <button class="btn btn-danger w-100">

            Excluir Conta

        </button>

    </div>

</div>

<!-- OFFCANVAS GRUPO -->

<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="groupPanel">

    <div class="offcanvas-header">

        <h5>Grupo</h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body">

        <div class="mb-3">

            <label class="form-label">
                Nome do Grupo
            </label>

            <input type="text"
                   class="form-control"
                   id="groupName"
                   disabled>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Descrição
            </label>

            <textarea class="form-control"
                      id="groupDescription"
                      disabled>
            </textarea>

        </div>

        <div class="mb-4">

            <label class="form-label">
                ID do Grupo
            </label>

            <input type="text"
                   class="form-control"
                   id="groupId"
                   disabled>

        </div>

        <hr>

        <h6>Membros</h6>

        <div id="membersList">

        </div>

        <button class="btn btn-danger w-100 mt-4">

            Excluir Grupo

        </button>

    </div>

</div>

    <div class="modal fade" id="modalCriarTarefa" tabindex="-1" aria-labelledby="modalTarefaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 18px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">

                <div class="modal-header" style="border-bottom: 1px solid #edf2f9;">
                    <h5 class="modal-title fw-bold" id="modalTarefaLabel" style="color: #233975;">Nova Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-close="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="formCriarTarefa">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label fw-semibold" style="color: #64748b;">Nome da Tarefa</label>
                            <input type="text" class="form-control" id="taskTitle" required style="border-radius: 10px; padding: 10px;">
                        </div>
                        <div class="mb-3">
                            <label for="taskDesc" class="form-label fw-semibold" style="color: #64748b;">Descrição</label>
                            <textarea class="form-control" id="taskDesc" rows="3" style="border-radius: 10px; padding: 10px;"></textarea>
                        </div>
                        <input type="hidden" id="taskStatusHidden">
                    </form>
                </div>

                <div class="modal-footer" style="border-top: 1px solid #edf2f9;">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 600; color: #64748b;">Cancelar</button>
                    <button type="submit" form="formCriarTarefa" class="btn btn-primary" style="border-radius: 10px; font-weight: 600; background: #3b82f6; border: none; padding: 8px 20px;">Criar Tarefa</button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCriarGrupo" tabindex="-1" aria-labelledby="modalCriarGrupoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 18px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">

                <div class="modal-header" style="border-bottom: 1px solid #edf2f9;">
                    <h5 class="modal-title fw-bold" id="modalCriarGrupoLabel" style="color: #233975;">Criar Novo Grupo</h5>
                    <button type="button" class="btn-close" data-bs-close="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="formCriarGrupo">
                        <div class="mb-3">
                            <label for="groupNameInput" class="form-label fw-semibold" style="color: #64748b;">Nome do Grupo</label>
                            <input type="text" class="form-control" id="groupNameInput" required style="border-radius: 10px; padding: 10px;">
                        </div>
                    </form>
                </div>

                <div class="modal-footer" style="border-top: 1px solid #edf2f9;">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 600; color: #64748b;">Cancelar</button>
                    <button type="submit" form="formCriarGrupo" class="btn btn-primary" style="border-radius: 10px; font-weight: 600; background: #3b82f6; border: none; padding: 8px 20px;">Criar Grupo</button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEntrarGrupo" tabindex="-1" aria-labelledby="modalEntrarGrupoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 18px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">

                <div class="modal-header" style="border-bottom: 1px solid #edf2f9;">
                    <h5 class="modal-title fw-bold" id="modalEntrarGrupoLabel" style="color: #233975;">Entrar em um Grupo</h5>
                    <button type="button" class="btn-close" data-bs-close="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="formEntrarGrupo">
                        <div class="mb-3">
                            <label for="groupIdInput" class="form-label fw-semibold" style="color: #64748b;">ID do Grupo</label>
                            <input type="number" class="form-control" id="groupIdInput" required style="border-radius: 10px; padding: 10px;" placeholder="Ex: 123">
                        </div>
                    </form>
                </div>

                <div class="modal-footer" style="border-top: 1px solid #edf2f9;">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 10px; font-weight: 600; color: #64748b;">Cancelar</button>
                    <button type="submit" form="formEntrarGrupo" class="btn btn-primary" style="border-radius: 10px; font-weight: 600; background: #3b82f6; border: none; padding: 8px 20px;">Entrar no Grupo</button>
                </div>

            </div>
        </div>
    </div>


<script src="kanban.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
