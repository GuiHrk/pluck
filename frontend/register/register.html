<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Pluck</title>
  <link rel="stylesheet" href="register.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">

</head>
<body>

<div id="pluckToast" class="toast text-white border-0" role="alert" aria-live="assertive" aria-atomic="true"
     style="position: fixed !important; top: 24px !important; right: 24px !important; z-index: 99999 !important;
            border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); min-width: 320px; display: none;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
  <div class="d-flex align-items-center" style="padding: 16px;">
    <div id="toastIcon" style="font-size: 20px; margin-right: 12px; display: flex; align-items-center;"></div>

    <div class="toast-body fw-medium" id="toastMessage" style="font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; flex-grow: 1; letter-spacing: -0.2px; line-height: 1.4;">
    </div>

    <button type="button" class="btn-close btn-close-white ms-auto me-1" data-bs-dismiss="toast" aria-label="Close" style="box-shadow: none; opacity: 0.6; width: 0.8em; height: 0.8em;"></button>
  </div>
</div>

<div class="container">

  <!-- CARD -->
  <div class="card">

    <!-- LADO ESQUERDO -->
    <div class="left">

      <p>
        Bem-vindo ao Pluck! Crie sua conta e comece a organizar tudo de forma simples,
        rápida e inteligente.
      </p>
    </div>

    <!-- LADO DIREITO -->
    <div class="right">
      <h2>Criar Conta</h2>

      <form id="cadastroForm">
        <div class="input-group">
          <input type="text" id="name" required>
          <label>Nome</label>
        </div>

        <div class="input-group">
          <input type="email" id="email" required>
          <label>Email</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" required>
          <label>Senha</label>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <div class="msg" id="msg"></div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="register.js"></script>
</body>
</html>
