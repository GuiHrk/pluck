<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pluck</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">

</head>

<body>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
    <div id="pluckToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" style="border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: all 0.3s ease;">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toastMessage">
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="container">

    <div class="card">

        <!-- LADO ESQUERDO -->
        <div class="left">
            <h1>Bem-vindo de volta</h1>
            <p>
                Entre na sua conta e continue gerenciando tudo com facilidade.
            </p>
        </div>

        <!-- LADO DIREITO -->
        <div class="right">
            <h2>Entrar</h2>

            <form id="loginForm">

                <div class="input-group">
                    <input type="email" id="email" required>
                    <label>Email</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" required>
                    <label>Senha</label>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <p class="link">
                Não tem conta? <a href="../register/register.html">Cadastre-se</a>
            </p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="login.js"></script>

</body>
</html>
